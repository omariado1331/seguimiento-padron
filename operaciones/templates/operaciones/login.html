<!doctype html>
<title>Login</title>
<h2>Login</h2>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <label>Usuario: <input name="username"></label><br>
  <label>Contraseña: <input type="password" name="password"></label><br>
  <button type="submit">Entrar</button>
</form>
