{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Panel {{ rol }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #qr-reader {
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">Bienvenido <strong>{{ user.username }}</strong></h1>

    <!-- Tarjeta de instrucciones -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Acciones a realizar (rol: {{ rol }})</h5>
        <p class="card-text mb-0" id="instrucciones"></p>
      </div>
    </div>

    <!-- Lector QR -->
    <div class="text-center mb-4">
      <div id="qr-reader"></div>
    </div>

    <!-- Historial -->
    <h5>Historial de cambios</h5>
    <div class="table-responsive">
      <table class="table table-sm table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th>Código</th>
            <th>Fase nueva</th>
            <th>Fecha / hora</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="historial-body">
          <!-- se llena vía JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- QR lib -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    const rol = "{{ rol }}";
    const csrf = "{{ csrf_token }}";
    const historial = []; // array local

    /* ---------- Textos de ayuda por rol ---------- */
    const textos = {
      SoporteInventarios:
        "Escanea el código QR del equipo. Se cambiará la fase a <b>En Revisión</b> y se marcará como <b>Recepcionado</b>.",
      SoporteMantenimiento:
        "Escanea el QR y <b>completa el checklist</b> (hardware, observaciones, etc.). Se pasará a <b>Revisado funcional</b>.",
      SoporteClonacion:
        "Escanea el QR. El equipo pasará a <b>En Masterización</b> y se marcará como <b>Clonado</b>.",
      SoporteMasterizacion:
        "Primer escaneo: pasa a <b>En Masterización</b>. Segundo escaneo: pasa a <b>Masterizado</b>.",
      SoporteEntrega:
        "Escanea el QR y <b>asigna el número de estación</b>. El equipo quedará <b>Asignado</b>."
    };
    document.getElementById("instrucciones").innerHTML =
      textos[rol] || "Sin instrucciones para este rol.";

    /* ---------- Utilidad: agregar fila al historial ---------- */
    function addFila(codigo, fase, ok, msg) {
      const fecha = new Date().toLocaleString("es-BO");
      const clase = ok ? "table-success" : "table-danger";
      const icono = ok ? "✅" : "❌";
      historial.unshift({ codigo, fase, fecha, ok, msg });
      const row = `
        <tr class="${clase}">
          <td>${codigo}</td>
          <td>${fase || "-"}</td>
          <td>${fecha}</td>
          <td>${icono} ${msg}</td>
        </tr>`;
      const tbody = document.getElementById("historial-body");
      tbody.insertAdjacentHTML("afterbegin", row);
    }

    /* ---------- Callback del lector ---------- */
    function onScanSuccess(decodedText) {
      fetch("{% url 'qr_escanear' %}", {
        method: "POST",
        headers: { "X-CSRFToken": csrf },
        body: new URLSearchParams({ codigo: decodedText })
      })
        .then(r => r.json())
        .then(data => {
          addFila(decodedText, data.nueva_fase, data.ok, data.msg);
        })
        .catch(err => {
          addFila(decodedText, "-", false, "Error de red");
        });
    }

    /* ---------- Iniciar lector ---------- */
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "qr-reader", { fps: 10, qrbox: 250 }, /* verbose= */ false);
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
